# Enterprise Simulated Egress Whitelist
# Entries support exact hostnames or glob wildcards (e.g., *.domain.com, *-dot-*.domain.com)

whitelist:
  - "accounts.google.com"
  - "asia-southeast1-aiplatform.clients6.google.com"
  - "cloudconsole-pa.clients6.google.com"
  - "cloudresourcemanager.clients6.google.com"
  - "cloudusersettings-pa.clients6.google.com"
  - "read-only-placeholder-aiplatform.clients6.google.com"
  - "waa-pa.clients6.google.com"
  - "cloud.google.com"
  - "colab-embedded.cloud.google.com"
  - "console.cloud.google.com"
  - "geminidataanalytics.cloud.google.com"
  - "asia-southeast1.notebooks.cloud.google.com"
  - "reauth.cloud.google.com"
  - "fonts.googleapis.com"
  - "*-0-colab-cloud.googleusercontent.com"
  - "*-dot-asia-southeast1.aiplatform-notebook.googleusercontent.com"
  - "lh3.googleusercontent.com"
  - "fonts.gstatic.com"
  - "ssl.gstatic.com"
  - "www.gstatic.com"
  - "accounts.youtube.com"
  - "accounts.google.com.sg"
  - "*.notebooks.googleusercontent.com"
  - "compute.googleapis.com"
  - "analytics.google.com"
  - "notebooks.clients6.google.com"
  - "dataproc.clients6.google.com"
  - "dataproc.googleapis.com"

settings:
  default_action: "block" # "block" returns 403; "log_only" logs without blocking
  reload_check_seconds: 2 # Interval in seconds to poll for file changes
  tls_passthrough: false # false: intercepts TLS so individual URL endpoints appear in Web UI; true: raw TCP bypass
